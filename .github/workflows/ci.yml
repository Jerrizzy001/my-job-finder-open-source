name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - name: Leak guard
        run: npm run leak-check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit and adapter fixture tests
        run: npm test
      - name: Build web UI
        run: npm run build:web
      - name: Build extension
        run: npm run build:extension
